# Render's free tier puts the service to sleep after 15 minutes without
# traffic, and the first request after that took over 45 s. A ping every
# 10 minutes keeps it awake. A missed ping only leaves a warning, since the
# next run tries again, so this never fails the workflow or sends an email.
name: Keep warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

env:
  HEALTH_URL: https://sparky-na2c.onrender.com/api/health

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health endpoint
        run: |
          if curl --silent --show-error --fail --max-time 60 \
                  --retry 3 --retry-delay 10 --retry-all-errors "$HEALTH_URL"; then
            echo
          else
            echo "::warning::$HEALTH_URL did not answer. The next scheduled run will try again."
          fi
