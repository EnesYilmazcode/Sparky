    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper:     #FAF9F6;
      --line-hi:   #D5CFC5;
      --panel:     #F3F1EC;
      --ink:       #1A1814;
      --ink-2:     #57514B;
      --ink-3:     #6E6862;
      --amber:     #D97706;
      --amber-ink: #B45309;

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.6;
      color: var(--ink);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
    }
    /* Breadboard hole grid, like the landing page hero. */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: radial-gradient(circle, #CFC8BD 1px, transparent 1.3px);
      background-size: 22px 22px;
      -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.5), transparent 70%);
      mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.5), transparent 70%);
    }

    :focus-visible { outline: 2px solid var(--amber-ink); outline-offset: 3px; border-radius: 6px; }

    header { padding: 1.25rem clamp(1rem, 4vw, 2rem); }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-decoration: none;
    }
    .brand img { display: block; }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 1rem clamp(1rem, 4vw, 2rem) 4rem;
    }
    .box { max-width: 30rem; text-align: center; }
    .wire { display: block; width: min(100%, 320px); height: auto; margin: 0 auto 2rem; }
    h1 {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: clamp(2rem, 4vw + 1rem, 2.75rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.035em;
    }
    p { margin-top: 0.9rem; font-size: 1.0625rem; color: var(--ink-2); }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      padding: 0 1.25rem;
      border-radius: 10px;
      border: 1px solid transparent;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-decoration: none;
      transition: background-color 0.15s, border-color 0.15s;
    }
    .btn-primary {
      background: var(--amber-ink);
      color: #fff;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 1px 2px rgba(146,64,14,0.25);
    }
    .btn-primary:hover { background: var(--amber-deep); }
    .btn-quiet { background: #fff; color: var(--ink); border-color: var(--line-hi); }
    .btn-quiet:hover { background: var(--panel); border-color: #BDB5A9; }
    .code { margin-top: 2rem; font-size: 0.8125rem; color: var(--ink-3); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
