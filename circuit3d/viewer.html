<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sparky · circuit preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #23262b; }
    #canvas-wrap { width: 100%; height: 100%; position: relative; }
    #canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>

  <!-- The same modules the editor runs, so the preview is the product -->
  <script src="js/board-model.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/breadboard.js"></script>
  <script src="js/components.js"></script>
  <script src="js/mna.js"></script>
  <script src="js/simulate.js"></script>

  <script>
  (function () {
    const App = window.App;
    const bb = App.createBreadboard();
    App.scene.add(bb.group);

    // A slow sway round a three-quarter view of the whole circuit, battery
    // included. A drag hands the camera to the visitor.
    const wide = Math.max(1, Math.min(2, innerWidth / innerHeight));
    const target = new THREE.Vector3(-5.2, 0.1, -0.4);
    const dist = 12 + 12 / wide;
    const tilt = 0.6;
    const yaw0 = -0.34;
    let swaying = true;
    function sway(t) {
      const yaw = yaw0 + Math.sin(t * 0.21) * 0.3;
      App.camera.position.set(
        target.x + dist * Math.cos(tilt) * Math.sin(yaw),
        target.y + dist * Math.sin(tilt),
        target.z + dist * Math.cos(tilt) * Math.cos(yaw));
    }
    App.controls.target.copy(target);
    App.controls.addEventListener('start', () => { swaying = false; });
    sway(0);
    App.controls.update();

    const tickers = new Set();
    App.addTicker = fn => tickers.add(fn);
    App.removeTicker = fn => tickers.delete(fn);

    fetch('../demo.sparky')
      .then(r => r.json())
      .then(data => {
        const parts = [];
        for (const c of data.components || []) {
          let built = null;
          const holes = (c.holeRefs || []).map(h => bb.getHole(h.col, h.row));
          const v = c.values || {};
          if (c.type === 'resistor') built = App.buildResistor(holes[0], holes[1], v.resistance);
          if (c.type === 'led')      built = App.buildLED(holes[0], holes[1], v.color || 'red');
          if (c.type === 'buzzer')   built = App.buildBuzzer(holes[0], holes[1]);
          if (c.type === 'button')   built = App.buildButton(holes[0], holes[1]);
          if (c.type === 'battery' && c.position) built = App.buildBattery(c.position.x, c.position.z);
          if (!built) { parts.push(null); continue; }
          App.scene.add(built.group);
          parts.push({ type: c.type, group: built.group, pins: built.pins, holeRefs: c.holeRefs || null,
                       values: Object.assign({}, App.PROPS[c.type] || {}, c.values || {}) });
        }

        const wires = [];
        for (const w of data.wires || []) {
          const end = (hole, ci, pi) => {
            if (hole) return bb.getHole(hole.col, hole.row).world.clone();
            const p = parts[ci];
            return p ? p.pins[pi].clone() : null;
          };
          const s = end(w.startHole, w.startCompIdx, w.startPinIdx);
          const e = end(w.endHole, w.endCompIdx, w.endPinIdx);
          if (!s || !e) continue;
          App.scene.add(App.buildWire(s, e, w.color ?? 0xef4444));
          wires.push({
            startHole: w.startHole, endHole: w.endHole,
            startComp: w.startCompIdx >= 0 ? parts[w.startCompIdx] : null, startPinIdx: w.startPinIdx,
            endComp: w.endCompIdx >= 0 ? parts[w.endCompIdx] : null, endPinIdx: w.endPinIdx,
          });
        }

        // Light what the simulator says is lit, and nothing else.
        const comps = parts.filter(Boolean);
        const result = App.simAnalyze(comps, wires);
        (result.ledsOn || []).forEach(c => {
          const I = result.currents ? result.currents[c._simId] : null;
          c.group.userData.setLit?.(true, I ? I / (c.values.maxCurrent || 0.02) : 1);
        });
      })
      .catch(err => console.warn('Could not load demo.sparky:', err));

    function animate() {
      requestAnimationFrame(animate);
      const t = performance.now() / 1000;
      tickers.forEach(fn => fn(t));
      if (swaying) sway(t);
      App.controls.update();
      App.renderer.render(App.scene, App.camera);
    }
    animate();
  })();
  </script>
</body>
</html>
