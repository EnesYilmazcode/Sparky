<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sparky: dashboard</title>
  <meta name="theme-color" content="#FAF9F6" />
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    :root {
      --paper:      #FAF9F6;
      --panel:      #F3F1EC;
      --panel-hi:   #EAE6DF;
      --line:       #E4DFD6;
      --line-hi:    #D5CFC5;
      --ink:        #1A1814;
      --ink-2:      #57514B;
      --ink-3:      #6E6862;
      --amber:      #D97706;
      --amber-lo:   #F59E0B;
      --amber-ink:  #B45309;
      --amber-deep: #92400E;
      --amber-wash: #FEF3C7;
      --stage:      #DCDAD4;
      --night:      #1A1814;
      --night-ink:  #E8E4DE;
      --danger:     #B91C1C;

      --side:   15.5rem;
      --gutter: clamp(1rem, 3vw, 2.5rem);
      --head:   'Space Grotesk', system-ui, sans-serif;
      --body:   'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      font-family: var(--body);
      font-size: 0.9375rem;
      line-height: 1.55;
      color: var(--ink);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
    }
    svg { flex-shrink: 0; }
    button { font: inherit; color: inherit; }

    :focus-visible {
      outline: 2px solid var(--amber-ink);
      outline-offset: 2px;
      border-radius: 6px;
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
    }
    .skip {
      position: absolute; left: 1rem; top: -3rem; z-index: 300;
      background: var(--ink); color: var(--paper);
      padding: 0.5rem 0.9rem; border-radius: 8px;
      font-weight: 600; font-size: 0.875rem; text-decoration: none;
    }
    .skip:focus { top: 0.75rem; }

    /* ── Buttons ─────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      min-height: 2.5rem;
      padding: 0 1rem;
      border-radius: 9px;
      border: 1px solid transparent;
      font-family: var(--head);
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
    }
    .btn-primary {
      background: var(--amber-ink);
      color: #fff;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 1px 2px rgba(146,64,14,0.25);
    }
    .btn-primary:hover { background: var(--amber-deep); }
    .btn-primary[disabled] { opacity: 0.65; cursor: progress; }
    .btn-quiet { background: #fff; color: var(--ink); border-color: var(--line-hi); }
    .btn-quiet:hover { background: var(--panel); border-color: #BDB5A9; }
    .btn-quiet[aria-pressed="true"] { background: var(--amber-wash); border-color: #F2C879; color: var(--amber-deep); }
    .btn-sm { min-height: 2.125rem; padding: 0 0.75rem; font-size: 0.8125rem; border-radius: 8px; }
    .btn-danger-text { background: transparent; color: var(--danger); }
    .btn-danger-text:hover { background: #FDECEC; }
    .icon-btn {
      display: grid;
      place-items: center;
      width: 2.25rem;
      height: 2.25rem;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--ink-2);
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
    }
    .icon-btn:hover { background: var(--panel-hi); color: var(--ink); }

    /* ── Frame: sidebar and main ─────────────────────────── */
    .app {
      display: grid;
      grid-template-columns: var(--side) minmax(0, 1fr);
      min-height: 100vh;
      /* The sidebar is sticky and one screen tall; paint its column too. */
      background: linear-gradient(90deg, var(--panel) calc(var(--side) - 1px), var(--line) 0 var(--side), transparent 0);
    }
    .side {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      padding: 1rem 0.75rem;
      background: var(--panel);
      border-right: 1px solid var(--line);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.55rem;
      font-family: var(--head);
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-decoration: none;
    }
    .brand img { display: block; }
    .tabs { display: flex; flex-direction: column; gap: 2px; }
    .tab {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      width: 100%;
      padding: 0.55rem 0.65rem;
      border: 0;
      border-radius: 9px;
      background: none;
      font-size: 0.9375rem;
      font-weight: 500;
      color: var(--ink-2);
      text-align: left;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
    }
    .tab:hover { background: var(--panel-hi); color: var(--ink); }
    .tab[aria-current="page"] {
      background: #fff;
      color: var(--ink);
      font-weight: 600;
      box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(60, 40, 10, 0.06);
    }
    .tab-count {
      margin-left: auto;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--ink-3);
      font-variant-numeric: tabular-nums;
    }
    .side-foot {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.75rem 0.4rem 0;
      border-top: 1px solid var(--line);
    }
    .avatar {
      display: grid;
      place-items: center;
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      background: var(--amber-wash);
      color: var(--amber-deep);
      font-family: var(--head);
      font-size: 0.875rem;
      font-weight: 700;
    }
    .who { min-width: 0; flex: 1; }
    .who p {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .who-name { font-size: 0.875rem; font-weight: 600; }
    .who-mail { font-size: 0.75rem; color: var(--ink-3); }

    .main { min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
      padding: 1.75rem var(--gutter) 1.25rem;
    }
    .topbar h1 {
      font-family: var(--head);
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.03em;
    }
    .topbar-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .content { flex: 1; padding: 0 var(--gutter) 4rem; }

    /* ── Cards ───────────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(13.5rem, 1fr));
      gap: 1rem;
    }
    .grid.sparks { grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .card:hover { border-color: var(--line-hi); box-shadow: 0 10px 28px -18px rgba(90, 58, 20, 0.4); }
    .thumb {
      aspect-ratio: 16 / 10;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 11px 11px 0 0;
      border-bottom: 1px solid var(--line);
      background-color: var(--stage);
      background-image: radial-gradient(circle, rgba(60,52,40,0.16) 1.1px, transparent 1.5px);
      background-size: 14px 14px;
      color: #8A8176;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      padding: 0.8rem 0.6rem 0.9rem 1rem;
    }
    .card-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .card-title {
      padding-top: 0.3rem;
      font-family: var(--head);
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.015em;
      overflow-wrap: anywhere;
    }
    /* The title button covers the card, so the whole card opens it. */
    .card-open {
      border: 0;
      background: none;
      padding: 0;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .card-open::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 12px;
    }
    .card-open:focus-visible { outline: none; }
    .card-open:focus-visible::after { outline: 2px solid var(--amber-ink); outline-offset: 2px; }
    .card-meta { font-size: 0.8125rem; color: var(--ink-3); padding-right: 0.4rem; }
    .card-desc {
      margin-top: 0.35rem;
      padding-right: 0.4rem;
      font-size: 0.875rem;
      color: var(--ink-2);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere;
    }
    .card-foot {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0 1rem 1rem;
    }

    .new-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      min-height: 12rem;
      padding: 1.5rem 1rem;
      border: 1.5px dashed var(--line-hi);
      border-radius: 12px;
      background: transparent;
      color: var(--ink-2);
      cursor: pointer;
      transition: border-color 0.15s, background-color 0.15s, color 0.15s;
    }
    .new-tile:hover { border-color: var(--amber-ink); background: rgba(254, 243, 199, 0.35); color: var(--amber-deep); }
    .new-tile strong { font-family: var(--head); font-size: 1rem; font-weight: 600; color: var(--ink); }
    .new-tile span { font-size: 0.8125rem; }
    .new-tile-plus {
      display: grid;
      place-items: center;
      width: 2.5rem;
      height: 2.5rem;
      margin-bottom: 0.35rem;
      border-radius: 50%;
      background: #fff;
      border: 1px solid var(--line-hi);
      color: var(--amber-ink);
    }

    /* Card actions menu (a disclosure: button plus list) */
    .menu-wrap { position: relative; z-index: 2; }
    .menu {
      position: absolute;
      right: 0;
      top: calc(100% + 4px);
      z-index: 20;
      min-width: 11.5rem;
      padding: 0.3rem;
      background: #fff;
      border: 1px solid var(--line-hi);
      border-radius: 10px;
      box-shadow: 0 18px 40px -14px rgba(26, 24, 20, 0.28);
    }
    .menu button {
      display: block;
      width: 100%;
      padding: 0.5rem 0.65rem;
      border: 0;
      border-radius: 6px;
      background: none;
      font-size: 0.875rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
    }
    .menu button:hover { background: var(--panel); }
    .menu button:focus-visible { outline-offset: -2px; }
    .menu .danger { color: var(--danger); }
    .menu .danger:hover { background: #FDECEC; }

    .star[aria-pressed="true"] { color: var(--amber); }
    .star[aria-pressed="true"] svg { fill: currentColor; }

    /* ── Sparks toolbar ──────────────────────────────────── */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    .search {
      flex: 1 1 16rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 2.5rem;
      padding: 0 0.75rem;
      background: #fff;
      border: 1px solid var(--line-hi);
      border-radius: 9px;
      color: var(--ink-3);
    }
    .search:focus-within { outline: 2px solid var(--amber-ink); outline-offset: 1px; }
    .search input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      font: inherit;
      color: var(--ink);
    }
    .search input::placeholder { color: var(--ink-3); opacity: 1; }

    /* ── Empty, error and loading states ─────────────────── */
    .empty {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      padding: 3.5rem 1.5rem;
      text-align: center;
      border: 1.5px dashed var(--line-hi);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.55);
    }
    .empty-icon {
      display: grid;
      place-items: center;
      width: 3rem;
      height: 3rem;
      margin-bottom: 0.5rem;
      border-radius: 12px;
      background: var(--panel);
      color: var(--ink-2);
    }
    .empty.is-error .empty-icon { background: #FDECEC; color: var(--danger); }
    .empty h2 { font-family: var(--head); font-size: 1.125rem; font-weight: 600; letter-spacing: -0.015em; }
    .empty p { max-width: 30rem; color: var(--ink-2); overflow-wrap: anywhere; }
    .empty-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-top: 0.9rem; }

    .skeleton { pointer-events: none; }
    .skeleton .thumb { background-image: none; background-color: var(--panel); }
    .sk-line { height: 0.75rem; margin: 0.9rem 1rem 0; border-radius: 4px; background: var(--panel); }
    .sk-line.short { width: 45%; margin-bottom: 1.25rem; }

    /* ── Publish dialog ──────────────────────────────────── */
    .sheet {
      width: min(30rem, calc(100vw - 2rem));
      margin: auto;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 30px 80px -20px rgba(26, 24, 20, 0.35);
      overflow: hidden;
    }
    .sheet::backdrop {
      background: rgba(26, 24, 20, 0.5);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
    }
    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 0.75rem 0.9rem 1.25rem;
    }
    .sheet-head h2 { font-family: var(--head); font-size: 1.1875rem; font-weight: 700; letter-spacing: -0.02em; }
    .sheet-thumb {
      aspect-ratio: 16 / 7;
      background-color: var(--stage);
      background-image: radial-gradient(circle, rgba(60,52,40,0.16) 1.1px, transparent 1.5px);
      background-size: 14px 14px;
      border-block: 1px solid var(--line);
    }
    .sheet-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .sheet-body { display: grid; gap: 0.9rem; padding: 1.1rem 1.25rem; }
    .field { display: grid; gap: 0.35rem; font-size: 0.8125rem; font-weight: 600; color: var(--ink-2); }
    .field-row { display: flex; justify-content: space-between; gap: 1rem; }
    .counter { font-weight: 500; color: var(--ink-3); font-variant-numeric: tabular-nums; }
    .input {
      width: 100%;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--line-hi);
      border-radius: 8px;
      background: #fff;
      font: 400 0.9375rem/1.5 var(--body);
      color: var(--ink);
    }
    .input:focus { outline: 2px solid var(--amber-ink); outline-offset: 0; border-color: transparent; }
    .input::placeholder { color: var(--ink-3); opacity: 1; }
    .input[readonly] { background: var(--panel); color: var(--ink-2); }
    textarea.input { resize: vertical; min-height: 5.5rem; }
    .sheet-note { font-size: 0.8125rem; color: var(--ink-3); }
    .sheet-foot { display: flex; justify-content: flex-end; gap: 0.5rem; padding: 0 1.25rem 1.25rem; }

    /* ── Toast ───────────────────────────────────────────── */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 1.25rem;
      z-index: 500;
      width: max-content;
      max-width: calc(100vw - 2rem);
      padding: 0.7rem 1rem;
      border-radius: 10px;
      background: var(--night);
      color: var(--night-ink);
      font-size: 0.875rem;
      box-shadow: 0 12px 30px -10px rgba(26, 24, 20, 0.45);
      opacity: 0;
      transform: translate(-50%, 8px);
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ── Sign-in gate ────────────────────────────────────── */
    .gate {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: var(--paper);
      text-align: center;
    }
    .gate-inner { display: flex; flex-direction: column; align-items: center; gap: 0.6rem; max-width: 24rem; }
    .gate-inner svg { color: var(--amber); }
    .gate-text { font-weight: 500; color: var(--ink-2); }
    .gate-hint { font-size: 0.875rem; color: var(--ink-3); }
    .gate-hint a { color: var(--amber-ink); font-weight: 600; }

    /* ── Motion ──────────────────────────────────────────── */
    @keyframes breathe { 50% { opacity: 0.35; } }
    @keyframes pop {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to   { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .gate-inner svg, .skeleton .thumb, .skeleton .sk-line { animation: breathe 1.4s ease-in-out infinite; }
      .sheet[open] { animation: pop 0.22s cubic-bezier(0.2, 0.7, 0.2, 1); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }

    /* ── Narrow screens: the sidebar becomes a top bar ───── */
    @media (max-width: 899px) {
      .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; background: none; }
      .side {
        position: sticky;
        z-index: 50;
        height: auto;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        padding: 0.6rem var(--gutter) 0.7rem;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .brand { order: 1; }
      .side-foot { order: 2; margin: 0 0 0 auto; padding: 0; border: 0; }
      .who { display: none; }
      .tabs {
        order: 3;
        flex: 1 1 100%;
        flex-direction: row;
        padding: 3px;
        border-radius: 10px;
        background: var(--panel-hi);
      }
      .tab { flex: 1; justify-content: center; }
      .tab-count { margin-left: 0; }
      .topbar { padding-top: 1.25rem; }
      .topbar h1 { font-size: 1.5rem; }
    }
    @media (max-width: 520px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: 0.75rem; }
      .grid.sparks { grid-template-columns: minmax(0, 1fr); }
      .card-body { padding-left: 0.8rem; }
      .card-meta { font-size: 0.75rem; }
      .new-tile { min-height: 10rem; }
      .topbar-actions { width: 100%; }
      .topbar-actions .btn { flex: 1 1 auto; }
      .sheet-foot .btn { flex: 1; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="gate" id="auth-gate" role="status">
    <div class="gate-inner">
      <img src="logo.svg" width="32" height="32" alt="" />
      <p class="gate-text" id="gate-text">Checking your sign-in</p>
      <p class="gate-hint" id="gate-hint" hidden></p>
    </div>
  </div>

  <div class="app">
    <aside class="side" aria-label="Sparky">
      <a href="landing.html" class="brand">
        <img src="logo.svg" width="24" height="24" alt="" />
        Sparky
      </a>
      <nav class="tabs" aria-label="Dashboard">
        <button class="tab" id="nav-my" type="button" aria-current="page">
          <svg width="16" height="16" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="1.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="1.5" width="4.5" height="4.5" rx="1"/><rect x="1.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/></svg>
          My circuits
          <span class="tab-count" id="circuits-count"></span>
        </button>
        <button class="tab" id="nav-sparks" type="button">
          <svg width="16" height="16" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2L4.5 8.5H8.5L6 13 11.5 6H7.5L9 2z"/></svg>
          Sparks
        </button>
      </nav>
      <div class="side-foot">
        <span class="avatar" id="avatar" aria-hidden="true"></span>
        <div class="who">
          <p class="who-name" id="who-name"></p>
          <p class="who-mail" id="who-mail"></p>
        </div>
        <button class="icon-btn" id="signout-btn" type="button" aria-label="Sign out" title="Sign out">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>

    <main class="main" id="main">
      <header class="topbar">
        <h1 id="page-title">My circuits</h1>
        <div class="topbar-actions" id="my-actions">
          <button class="btn btn-quiet" type="button" id="import-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>

          </button>
          <button class="btn btn-primary" type="button" id="new-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>

      <div class="content">
        <section id="tab-my" aria-labelledby="page-title">
          <div class="grid" id="circuits-grid"></div>

        <section id="tab-sparks" aria-labelledby="page-title" hidden>
          <div class="toolbar">
            <label class="search">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
              <span class="sr-only">Search Sparks</span>
              <input type="search" id="sparks-search" placeholder="Search by title, author or description" autocomplete="off" />
            </label>
            <button class="btn btn-quiet" id="sparks-fav-btn" type="button" aria-pressed="false">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              Favorites
            </button>
          </div>
          <div class="grid sparks" id="sparks-grid"></div>
        </section>
      </div>
    </main>
  </div>

  <input type="file" id="import-input" accept=".sparky,.json" multiple hidden />

  <dialog class="sheet" id="publish-modal" aria-labelledby="publish-title">
    <form id="publish-form">
      <div class="sheet-head">
        <h2 id="publish-title">Publish to Sparks</h2>
        <button class="icon-btn" type="button" id="publish-close" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="sheet-thumb" id="publish-thumb"></div>
      <div class="sheet-body">
        <label class="field">Title
          <input id="publish-name" class="input" type="text" maxlength="80" required placeholder="Name your circuit" />
        </label>
        <label class="field">Published as
          <input id="publish-author" class="input" type="text" maxlength="80" placeholder="Your name" />
        </label>
        <label class="field">
          <span class="field-row"><span>Description</span><span class="counter" id="desc-count">0 / 500</span></span>
          <textarea id="publish-desc" class="input" maxlength="500" rows="3" aria-describedby="desc-count" placeholder="What does it do? What should people try?"></textarea>
        </label>
        <p class="sheet-note">Anyone signed in to Sparky can see and fork what you publish.</p>
      </div>
      <div class="sheet-foot">
        <button class="btn btn-quiet" type="button" id="publish-cancel">Cancel</button>
        <button class="btn btn-primary" type="submit" id="publish-submit">Publish</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Firebase SDKs (compat for vanilla JS) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDZDxmH5HHwx8N3U1FVglx6Iubh665t42s",
      authDomain: "buildwithsparky.firebaseapp.com",
      projectId: "buildwithsparky",
      storageBucket: "buildwithsparky.firebasestorage.app",
      messagingSenderId: "596770160500",
      appId: "1:596770160500:web:8b3761e163291ab759f621"
    };

    let auth = null;
    let db   = null;
    let _currentUser = null;
    let _authUsername = null;

    // ── DOM helpers ─────────────────────────────────────────────
    // Every card is built from nodes. Strings become text nodes or
    // attribute values, never markup, so stored data cannot run script.
    function h(tag, props, ...kids) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(props || {})) {
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? '' : String(v));
      }
      for (const kid of kids.flat()) if (kid != null && kid !== false && kid !== '') el.append(kid);
      return el;
    }

    // Icon markup is constant. Nothing from storage or Firestore goes here.
    const ICONS = {
      board: '<svg viewBox="0 0 36 25" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><rect x="1" y="4" width="34" height="17" rx="1.5"/><path d="M7 4v17M13 4v17M18 4v17M23 4v17M29 4v17M4 1.5V4M10 1.5V4M15 1.5V4M20 1.5V4M26 1.5V4M31 1.5V4M4 21v2.5M10 21v2.5M15 21v2.5M20 21v2.5M26 21v2.5M31 21v2.5"/></svg>',
      dots:  '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
      star:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
      plus:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
      search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
      alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></svg>',
    };
    function icon(name, size) {
      const t = document.createElement('template');
      t.innerHTML = ICONS[name];
      const svg = t.content.firstElementChild;
      svg.setAttribute('width', size);
      svg.setAttribute('height', size);
      svg.setAttribute('aria-hidden', 'true');
      return svg;
    }

    function button(label, onclick, cls) {
      return h('button', { class: 'btn ' + (cls || 'btn-quiet'), type: 'button', onclick }, label);
    }

    function emptyState({ iconName, title, text, actions, error }) {
      return h('div', { class: 'empty' + (error ? ' is-error' : '') },
        h('span', { class: 'empty-icon' }, icon(iconName || 'board', iconName === 'board' ? 34 : 22)),
        h('h2', null, title),
        text && h('p', null, text),
        actions && actions.length && h('div', { class: 'empty-actions' }, actions));
    }

    function fmtDate(ms) {
      if (!ms) return '';
      const d = new Date(ms);
      if (isNaN(d)) return '';
      const opts = { month: 'short', day: 'numeric' };
      if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
      return d.toLocaleDateString(undefined, opts);
    }

    // ── Safe thumbnail image ────────────────────────────────────────────
    // Thumbnails come from other users' sparks and from imported files. Only a
    // base64 PNG, JPEG or WebP data URL is kept: no remote URL (a tracking
    // pixel for every viewer), no SVG, nothing else.
    const THUMB_RE  = /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/]+={0,2}$/;
    const THUMB_MAX = 300 * 1024;
    function safeThumb(src) {
      return typeof src === 'string' && src.length <= THUMB_MAX && THUMB_RE.test(src) ? src : null;
    }
    function makeThumbImg(src) {
      const ok = safeThumb(src);
      if (!ok) return null;
      const img = document.createElement('img');
      img.src = ok;
      img.alt = '';
      img.decoding = 'async';
      return img;
    }
    function thumb(src) {
      return h('div', { class: 'thumb' }, makeThumbImg(src) || icon('board', 40));
    }

    // Circuit data can come from a file or another user's spark, so anything
    // that should be a list is checked before its length is used.
    function listOf(v) { return Array.isArray(v) ? v : []; }

    // ── Auth ────────────────────────────────────────────────────
    // Circuits live in localStorage, so a sign-out has to wipe them or the next
    // person on this browser opens the previous user's work.
    function clearAppStorage() {
      [LS_KEY, STARRED_KEY, 'sparky_username'].forEach(k => localStorage.removeItem(k));
      sessionStorage.removeItem('sparky_load_circuit');
      _circuitsCache = [];
      _sparksCache   = [];
    }

    function logout() {
      auth.signOut().then(() => {
        clearAppStorage();
        window.location.href = 'landing.html';
      }).catch(e => {
        console.error('Sign out failed:', e);
        showToast('Could not sign out. Check your connection.');
      });
    }

    function gateHint(text, linkText, href) {
      const hint = document.getElementById('gate-hint');
      hint.replaceChildren(text, ' ', h('a', { href }, linkText));
      hint.hidden = false;
    }

    function showUser(user) {
      const name = user.displayName || _authUsername || 'Signed in';
      document.getElementById('who-name').textContent = name;
      document.getElementById('who-mail').textContent = user.email || '';
      document.getElementById('avatar').textContent = (name.trim()[0] || '?').toUpperCase();
    }

    // ── Local project storage ─────────────────────────────────────
    const LS_KEY = 'sparky_local_projects';
    let _circuitsCache = [];

    function loadCircuits() {
      try { _circuitsCache = listOf(JSON.parse(localStorage.getItem(LS_KEY) || '[]')); }
      catch { _circuitsCache = []; }
      return _circuitsCache;
    }

    function saveCircuitLocal(entry) {
      const projects = loadCircuits();
      const idx = projects.findIndex(p => p.id === entry.id);
      if (idx >= 0) projects[idx] = entry; else projects.unshift(entry);
      localStorage.setItem(LS_KEY, JSON.stringify(projects));
    }

    function deleteCircuitLocal(id) {
      const projects = loadCircuits().filter(p => p.id !== id);
      localStorage.setItem(LS_KEY, JSON.stringify(projects));
    }

    function newId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    // ── Sparks (Firestore community collection) ──────────────────
    let _sparksCache = []; // local cache of fetched sparks
    let _sparksError = null; // last fetch failure, null when the fetch worked

    // A denied read, an offline read and an empty collection all used to look
    // the same to the user, so keep the reason and say which one it was.
    function firestoreErrorText(e, action) {
      const code = (e && e.code) || '';
      if (code === 'permission-denied' || code === 'unauthenticated')
        return `Not allowed to ${action}. Sign out and back in, then try again.`;
      if (code === 'unavailable' || code === 'deadline-exceeded')
        return `Could not ${action}. Check your connection.`;
      return `Could not ${action} (${code || 'unexpected error'}).`;
    }

    // sharedAt is a server Timestamp on new sparks and an ISO string on older
    // ones. Firestore sorts mixed types by type first, so sort here by time.
    function sharedMillis(v) {
      if (v && typeof v.toMillis === 'function') return v.toMillis();
      if (typeof v === 'number') return v;
      const t = typeof v === 'string' ? Date.parse(v) : NaN;
      return isNaN(t) ? 0 : t;
    }

    async function fetchSparks() {
      try {
        const snap = await db.collection('sparks').orderBy('sharedAt', 'desc').get();
        _sparksCache = snap.docs.map(doc => ({ _docId: doc.id, ...doc.data() }))
          .sort((a, b) => sharedMillis(b.sharedAt) - sharedMillis(a.sharedAt));
        _sparksError = null;
      } catch (e) {
        console.warn('Failed to fetch sparks:', e);
        _sparksError = e;
      }
      return _sparksCache;
    }

    async function saveSpark(entry) {
      try {
        await db.collection('sparks').doc(entry.id).set(entry);
        return true;
      } catch (e) {
        console.error('Failed to publish spark:', e);
        showToast(firestoreErrorText(e, 'publish'));
        return false;
      }
    }

    async function removeSpark(id) {
      try {
        await db.collection('sparks').doc(id).delete();
        return true;
      } catch (e) {
        console.error('Failed to remove spark:', e);
        showToast(firestoreErrorText(e, 'remove that spark'));
        return false;
      }
    }

    // ── Publish dialog ─────────────────────────────────────────
    const publishModal = document.getElementById('publish-modal');
    let _publishIdx = null;

    function updateDescCount() {
      const n = document.getElementById('publish-desc').value.length;
      document.getElementById('desc-count').textContent = `${n} / 500`;
    }

    function openPublishModal(idx) {
      const c = _circuitsCache[idx];
      if (!c) return;
      _publishIdx = idx;

      document.getElementById('publish-name').value = String(c.name || '').slice(0, 80);
      document.getElementById('publish-desc').value = '';
      updateDescCount();

      // Signed-in users publish under their account name.
      const authorEl = document.getElementById('publish-author');
      authorEl.value    = _authUsername || localStorage.getItem('sparky_username') || '';
      authorEl.readOnly = !!_authUsername;

      const th = document.getElementById('publish-thumb');
      th.replaceChildren();
      const img = makeThumbImg(c.thumbnail);
      if (img) { img.alt = 'Circuit thumbnail'; th.append(img); }

      if (!publishModal.open) publishModal.showModal();
      document.getElementById('publish-name').focus();
    }

    function closePublishModal() {
      if (publishModal.open) publishModal.close();
      _publishIdx = null;
    }

    async function submitPublish() {
      const c = _circuitsCache[_publishIdx];
      if (!c) return;

      if (!_currentUser) {
        showToast('Sign in to publish.');
        return;
      }

      // Limits match firestore.rules, so a valid form never hits a denied write.
      const clip   = (s, n) => String(s || '').trim().slice(0, n);
      const name   = clip(document.getElementById('publish-name').value, 80) || clip(c.name, 80) || 'Untitled';
      const author = clip(document.getElementById('publish-author').value, 80) || 'Anonymous';
      const desc   = clip(document.getElementById('publish-desc').value, 500);
      const components = listOf(c.components ?? c.circuit?.components);
      const wires      = listOf(c.wires      ?? c.circuit?.wires);
      if (components.length > 500 || wires.length > 1000) {
        showToast('This circuit is too big to publish.');
        return;
      }

      // Persist username for next time (only if not locked to auth account)
      if (!_authUsername) localStorage.setItem('sparky_username', author);

      const submit = document.getElementById('publish-submit');
      submit.disabled = true;
      submit.textContent = 'Publishing…';
      const published = await saveSpark({
        id:         c.id,
        uid:        _currentUser.uid,
        name,
        author,
        desc,
        thumbnail:  safeThumb(c.thumbnail),
        sharedAt:   firebase.firestore.FieldValue.serverTimestamp(),
        components,
        wires,
      });
      submit.disabled = false;
      submit.textContent = 'Publish';

      if (!published) return; // saveSpark already said why

      closePublishModal();
      showToast(`Published "${name}" to Sparks.`);
      if (!document.getElementById('tab-sparks').hidden) renderSparks();
    }

    document.getElementById('publish-form').addEventListener('submit', e => {
      e.preventDefault();
      submitPublish();
    });
    document.getElementById('publish-desc').addEventListener('input', updateDescCount);
    document.getElementById('publish-close').addEventListener('click', closePublishModal);
    document.getElementById('publish-cancel').addEventListener('click', closePublishModal);
    // A click on the backdrop lands on the dialog itself, outside its box.
    publishModal.addEventListener('click', e => {
      if (e.target !== publishModal) return;
      const r = publishModal.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) closePublishModal();
    });

    // ── Tabs ───────────────────────────────────────────────────
    function switchTab(tab) {
      const isMy = tab !== 'sparks';
      document.getElementById('tab-my').hidden = !isMy;
      document.getElementById('tab-sparks').hidden = isMy;
      document.getElementById('my-actions').hidden = !isMy;
      for (const [id, on] of [['nav-my', isMy], ['nav-sparks', !isMy]]) {
        const b = document.getElementById(id);
        if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
      }
      const title = isMy ? 'My circuits' : 'Sparks';
      document.getElementById('page-title').textContent = title;
      document.title = `Sparky: ${title}`;
      history.replaceState(null, '', location.pathname + location.search + (isMy ? '' : '#sparks'));

      if (!isMy && _currentUser) renderSparks(); // always re-fetch, others publish too
    }
    document.getElementById('nav-my').addEventListener('click', () => switchTab('my'));
    document.getElementById('nav-sparks').addEventListener('click', () => switchTab('sparks'));

    // ── Card menu (button plus a list of actions) ───────────────
    function closeMenus(except) {
      document.querySelectorAll('.menu-wrap.open').forEach(w => {
        if (w === except) return;
        w.classList.remove('open');
        w.querySelector('.menu').hidden = true;
        w.querySelector('.menu-btn').setAttribute('aria-expanded', 'false');
      });
    }

    function actionsMenu(label, items) {
      const list = h('div', { class: 'menu', hidden: true },
        items.map(([text, fn, cls]) => h('button', { type: 'button', class: cls, onclick: () => { closeMenus(); fn(); } }, text)));
      const wrap = h('div', { class: 'menu-wrap' });
      const btn = h('button', {
        class: 'icon-btn menu-btn', type: 'button', 'aria-label': label, 'aria-expanded': 'false',
        onclick: e => {
          e.stopPropagation();
          const open = !wrap.classList.contains('open');
          closeMenus(wrap);
          wrap.classList.toggle('open', open);
          list.hidden = !open;
          btn.setAttribute('aria-expanded', String(open));
          if (open) list.querySelector('button').focus();
        },
      }, icon('dots', 18));
      wrap.append(btn, list);
      return wrap;
    }

    document.addEventListener('click', e => { if (!e.target.closest('.menu-wrap')) closeMenus(); });
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      const open = document.querySelector('.menu-wrap.open');
      if (!open) return;
      closeMenus();
      open.querySelector('.menu-btn').focus();
    });

    // ── My circuits ─────────────────────────────────────────────
    function renderMyCircuits() {
      const circuits = loadCircuits();
      const grid = document.getElementById('circuits-grid');
      document.getElementById('circuits-count').textContent = circuits.length ? String(circuits.length) : '';
      grid.replaceChildren();

      if (!circuits.length) {
        grid.append(emptyState({
          iconName: 'board',
          title: 'No circuits yet',
          text: 'Circuits you build in the editor show up here on their own. Start a blank one, import a .sparky file, or open the demo.',
          actions: [
            button('New circuit', newCircuit, 'btn-primary'),
            button('Import .sparky', triggerImport),
            button('Open the demo', openWithDemo),
          ],
        }));
        return;
      }

      grid.append(h('button', { class: 'new-tile', id: 'new-tile', type: 'button', onclick: newCircuit },
        h('span', { class: 'new-tile-plus' }, icon('plus', 18)),
        h('strong', null, 'New circuit'),
        h('span', null, 'Start from a blank board')));
      circuits.forEach((c, idx) => grid.append(makeCircuitCard(c, idx)));
    }

    function makeCircuitCard(c, idx) {
      const name = String(c.name || 'Untitled');
      // A crafted file or spark can make .length a string of markup.
      const parts = listOf(c.components ?? c.circuit?.components).length;
      const wires = listOf(c.wires      ?? c.circuit?.wires     ).length;
      const saved = fmtDate(sharedMillis(c.updatedAt));

      return h('article', { class: 'card' },
        thumb(c.thumbnail),
        h('div', { class: 'card-body' },
          h('div', { class: 'card-row' },
            h('h3', { class: 'card-title' },
              h('button', { class: 'card-open', type: 'button', onclick: () => openCircuit(idx) }, name)),
            actionsMenu(`More actions for ${name}`, [
              ['Open', () => openCircuit(idx)],
              ['Publish to Sparks', () => openPublishModal(idx)],
              ['Download .sparky', () => downloadCircuit(idx)],
              ['Delete', () => deleteCircuit(idx), 'danger'],
            ])),
          h('p', { class: 'card-meta' }, `${parts} part${parts === 1 ? '' : 's'}, ${wires} wire${wires === 1 ? '' : 's'}`),
          saved && h('p', { class: 'card-meta' }, `Saved ${saved}`)));
    }

    function openCircuit(idx) {
      const c = _circuitsCache[idx];
      if (!c) return;
      // Pass the full entry so designer can restore name + id
      const payload = { id: c.id, name: c.name, components: listOf(c.components ?? c.circuit?.components), wires: listOf(c.wires ?? c.circuit?.wires) };
      sessionStorage.setItem('sparky_load_circuit', JSON.stringify(payload));
      window.location.href = 'circuit3d/index.html';
    }

    function downloadCircuit(idx) {
      const c = _circuitsCache[idx];
      if (!c) return;
      const payload = { id: c.id, name: c.name, components: listOf(c.components ?? c.circuit?.components), wires: listOf(c.wires ?? c.circuit?.wires) };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${String(c.name || 'circuit').replace(/[\\/:*?"<>|]+/g, '').trim().replace(/\s+/g, '_') || 'circuit'}.sparky`;
      a.click();
      URL.revokeObjectURL(url);
      showToast(`Downloaded "${c.name || 'circuit'}".`);
    }

    function deleteCircuit(idx) {
      const c = _circuitsCache[idx];
      if (!c) return;
      const name = c.name || 'this circuit';
      if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
      deleteCircuitLocal(c.id);
      renderMyCircuits();
      showToast(`Deleted "${name}".`);
      const next = document.getElementById('new-tile') || document.querySelector('#circuits-grid button');
      if (next) next.focus();
    }

    function newCircuit() {
      sessionStorage.removeItem('sparky_load_circuit');
      window.location.href = 'circuit3d/index.html';
    }

    function openWithDemo() {
      fetch('demo.sparky')
        .then(r => r.json())
        .then(data => sessionStorage.setItem('sparky_load_circuit', JSON.stringify(data)))
        .catch(() => {})
        .finally(() => { window.location.href = 'circuit3d/index.html'; });
    }

    document.getElementById('new-btn').addEventListener('click', newCircuit);

    // ── Import .sparky ─────────────────────────────────────────
    function triggerImport() {
      document.getElementById('import-input').click();
    }
    document.getElementById('import-btn').addEventListener('click', triggerImport);

    document.getElementById('import-input').addEventListener('change', async function () {
      const files = Array.from(this.files);
      if (!files.length) return;
      let imported = 0;

      for (const file of files) {
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          const name = (typeof data.name === 'string' && data.name.trim()) ||
                       file.name.replace(/\.(sparky|json)$/i, '').replace(/_/g, ' ');
          // Always a new id: keeping the file's id overwrote any circuit that
          // shared it, and a file passed between two people gave both the
          // same spark id, so the second one could never publish it.
          saveCircuitLocal({
            id:        newId(),
            name,
            thumbnail: safeThumb(data.thumbnail),
            updatedAt: new Date().toISOString(),
            components: listOf(data.components),
            wires:      listOf(data.wires),
          });
          imported++;
        } catch {}
      }

      this.value = '';
      renderMyCircuits();
      if (!imported) showToast(files.length === 1 ? 'That file is not a circuit Sparky can read.' : 'None of those files could be read.');
      else if (imported < files.length) showToast(`Imported ${imported} of ${files.length} files. The rest could not be read.`);
      else showToast(imported === 1 ? 'Imported 1 circuit.' : `Imported ${imported} circuits.`);
    });

    // ── Favorites ───────────────────────────────────────────────
    const STARRED_KEY = 'sparky_starred';
    let _favOnly = false;

    function getStarred() {
      try { return new Set(JSON.parse(localStorage.getItem(STARRED_KEY) || '[]')); } catch { return new Set(); }
    }

    function toggleStar(id, e) {
      if (e) e.stopPropagation();
      const starred = getStarred();
      const on = !starred.has(id);
      if (on) starred.add(id); else starred.delete(id);
      localStorage.setItem(STARRED_KEY, JSON.stringify([...starred]));
      // Update in place so keyboard focus stays on the star.
      const btn = e && e.currentTarget;
      if (btn && !_favOnly) {
        btn.setAttribute('aria-pressed', String(on));
        btn.title = on ? 'Remove from favorites' : 'Add to favorites';
      } else {
        renderSparksFromCache();
      }
    }

    function toggleFavFilter() {
      _favOnly = !_favOnly;
      document.getElementById('sparks-fav-btn').setAttribute('aria-pressed', String(_favOnly));
      renderSparksFromCache();
    }
    document.getElementById('sparks-fav-btn').addEventListener('click', toggleFavFilter);
    document.getElementById('sparks-search').addEventListener('input', () => renderSparksFromCache());

    // ── Sparks ─────────────────────────────────────────────────
    function skeletonCard() {
      return h('div', { class: 'card skeleton', 'aria-hidden': 'true' },
        h('div', { class: 'thumb' }), h('div', { class: 'sk-line' }), h('div', { class: 'sk-line short' }));
    }

    async function renderSparks() {
      const grid = document.getElementById('sparks-grid');
      if (!_sparksCache.length) grid.replaceChildren(skeletonCard(), skeletonCard(), skeletonCard());
      grid.setAttribute('aria-busy', 'true');
      await fetchSparks();
      grid.removeAttribute('aria-busy');
      renderSparksFromCache();
    }

    function renderSparksFromCache() {
      const grid = document.getElementById('sparks-grid');
      const starred = getStarred();
      const search = document.getElementById('sparks-search');
      const query = (search.value || '').toLowerCase().trim();

      let sparks = [..._sparksCache];
      if (query) sparks = sparks.filter(s =>
        String(s.name || '').toLowerCase().includes(query) ||
        String(s.author || '').toLowerCase().includes(query) ||
        String(s.desc || '').toLowerCase().includes(query)
      );
      if (_favOnly) sparks = sparks.filter(s => starred.has(s._docId));

      grid.replaceChildren();

      if (!sparks.length) {
        if (_sparksError && !_sparksCache.length) {
          grid.append(emptyState({ iconName: 'alert', error: true, title: 'Sparks did not load',
            text: firestoreErrorText(_sparksError, 'load Sparks'),
            actions: [button('Try again', renderSparks)] }));
        } else if (query) {
          grid.append(emptyState({ iconName: 'search', title: 'No matches',
            text: `Nothing in ${_favOnly ? 'your favorites' : 'Sparks'} matches "${search.value.trim()}".`,
            actions: [button('Clear search', () => { search.value = ''; renderSparksFromCache(); search.focus(); })] }));
        } else if (_favOnly) {
          grid.append(emptyState({ iconName: 'star', title: 'No favorites yet',
            text: 'Tap the star on a spark to keep it here.',
            actions: [button('Show all sparks', toggleFavFilter)] }));
        } else {
          grid.append(emptyState({ iconName: 'board', title: 'No sparks yet',
            text: 'Publish one of your circuits from its menu in My circuits and it shows up here for everyone.',
            actions: [button('Go to My circuits', () => switchTab('my'))] }));
        }
        return;
      }

      const myUid = _currentUser?.uid;
      sparks.forEach(spark => grid.append(makeSparkCard(spark, starred, myUid)));
    }

    function makeSparkCard(spark, starred, myUid) {
      // Actions key on the Firestore doc id, not the id field inside the doc.
      const docId  = spark._docId;
      const name   = String(spark.name || 'Untitled');
      const author = typeof spark.author === 'string' ? spark.author : '';
      const desc   = typeof spark.desc === 'string' ? spark.desc : '';
      const when   = fmtDate(sharedMillis(spark.sharedAt));
      const on     = starred.has(docId);
      const isOwn  = !!myUid && spark.uid === myUid;
      const byline = [author && `by ${author}`, when].filter(Boolean).join(', ');

      return h('article', { class: 'card spark-card' },
        thumb(spark.thumbnail),
        h('div', { class: 'card-body' },
          h('div', { class: 'card-row' },
            h('h3', { class: 'card-title' }, name),
            h('button', {
              class: 'icon-btn star', type: 'button', 'aria-pressed': String(on),
              'aria-label': `Favorite ${name}`, title: on ? 'Remove from favorites' : 'Add to favorites',
              onclick: e => toggleStar(docId, e),
            }, icon('star', 18))),
          byline && h('p', { class: 'card-meta' }, byline),
          desc && h('p', { class: 'card-desc' }, desc)),
        h('div', { class: 'card-foot' },
          h('button', { class: 'btn btn-sm btn-quiet', type: 'button', onclick: () => forkSpark(docId) }, 'Fork to my circuits'),
          isOwn && h('button', { class: 'btn btn-sm btn-danger-text', type: 'button', onclick: () => unshareFromSparks(docId) }, 'Remove')));
    }

    function forkSpark(docId) {
      const spark = _sparksCache.find(s => s._docId === docId);
      if (!spark) return;
      saveCircuitLocal({
        id:        newId(),
        name:      String(spark.name || 'Untitled'),
        thumbnail: safeThumb(spark.thumbnail),
        updatedAt: new Date().toISOString(),
        components: listOf(spark.components),
        wires:      listOf(spark.wires),
      });
      switchTab('my');
      renderMyCircuits();
      showToast(`Forked "${spark.name || 'Untitled'}" to your circuits.`);
    }

    async function unshareFromSparks(docId) {
      const spark = _sparksCache.find(s => s._docId === docId);
      const name = (spark && spark.name) || 'this spark';
      if (!confirm(`Remove "${name}" from Sparks? Other people will no longer see it.`)) return;
      const removed = await removeSpark(docId);
      await renderSparks();
      if (removed) showToast(`Removed "${name}" from Sparks.`);
    }

    // ── Toast ──────────────────────────────────────────────────
    let _toastTimer;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
    }

    // ── Start ──────────────────────────────────────────────────
    document.getElementById('signout-btn').addEventListener('click', logout);
    renderMyCircuits();
    switchTab(location.hash === '#sparks' ? 'sparks' : 'my');

    // Auth gate: the page stays covered until Firebase confirms a session,
    // and visitors without one go to the landing page's sign-in.
    if (!window.firebase) {
      document.getElementById('gate-text').textContent = 'Could not load sign-in';
      gateHint('Check your connection and reload the page, or', 'go back to the home page', 'landing.html');
    } else {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db   = firebase.firestore();
      const slow = setTimeout(() => gateHint('This is taking a while. Check your connection, or', 'go back to the home page', 'landing.html'), 8000);

      auth.onAuthStateChanged(user => {
        clearTimeout(slow);
        if (!user) {
          window.location.replace('landing.html#signin');
          return;
        }
        _currentUser = user;
        _authUsername = user.email ? user.email.split('@')[0] : (user.displayName || '');
        localStorage.setItem('sparky_username', _authUsername);
        showUser(user);
        document.getElementById('auth-gate').hidden = true;
        if (!document.getElementById('tab-sparks').hidden) renderSparks();
      });
    }
  </script>
</body>
</html>
